        /* КИБЕРСПОРТИВНЫЙ ИНТЕРФЕЙС И ЦВЕТОВАЯ СХЕМА */
        :root {

            --bg-card: #131722;
            --bg-input: #1C2130;

            --text-main: #FFFFFF;
            --text-muted: #aaa;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Arial', '-apple-system', sans-serif;
            scroll-behavior: smooth;
        }

        /* 1. ГЛАВНЫЙ СЛАЙД ДО АВТОРИЗАЦИИ */
        .welcome-slide {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(11, 14, 20, 0.4) 0%, rgba(11, 14, 20, 0.95) 100%), 
                        url('https://steamstatic.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* НАВИГАЦИОННАЯ ШАПКА */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ct-neon), var(--t-neon));
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.4);
            user-select: none;
        }
        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .lang-select {
            background: rgba(26, 31, 41, 0.9);
            color: white;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            outline: none;
        }

        /* МАРКЕТИНГОВЫЙ СЛОГАН */
        .slogan-container {
            text-align: center;
            max-width: 1000px;
            background: rgba(11, 14, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: 45px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            margin: 40px 0;
            z-index: 10;
        }
        .slogan {
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.4;
            margin-top: 0;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }
        .ct-text { color: var(--ct-neon); text-shadow: 0 0 20px rgba(0, 163, 255, 0.6); }
        .t-text { color: var(--t-neon); text-shadow: 0 0 20px rgba(255, 106, 0, 0.6); }
        .server-text {
            display: block;
            font-size: 52px;
            color: #FFFFFF;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            margin-top: 15px;
        }

        /* АГРЕССИВНАЯ КНОПКА ВХОДА */
        .btn-login {
            display: inline-block;
            background: linear-gradient(90deg, var(--t-neon) 0%, #FF8C00 100%);
            color: white !important;
            text-decoration: none !important;
            padding: 20px 60px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 106, 0, 0.8);
        }
        .footer-hint {
            color: var(--text-muted);
            font-size: 14px;
            background: rgba(11, 14, 20, 0.8);
            padding: 8px 20px;
            border-radius: 10px;
            z-index: 10;
        }

        /* 2. ИНТЕРАКТИВНАЯ СЕТКА ИЗ 20 КРУЖКОВ */
        .main-dashboard {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .section-title {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 50px;
            color: var(--ct-neon);
            font-size: 28px;
            text-shadow: 0 0 15px rgba(0, 163, 255, 0.3);
        }
        .circles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            justify-items: center;
        }
        .circle-card {
            width: 160px;
            height: 160px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            padding: 15px;
            box-sizing: border-box;
            user-select: none;
        }
        .circle-card:hover {
            transform: translateY(-8px);
            border-color: var(--t-neon);
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.4);
        }
        .circle-icon { font-size: 38px; margin-bottom: 8px; }
        .circle-title { font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.2; }

        /* 3. ЖЕЛЕЗОБЕТОННОЕ МОДАЛЬНОЕ ОКНО (РЕГИСТРАЦИЯ) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.95);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        .modal-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 40px rgba(0, 163, 255, 0.3);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }
        .modal-card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 25px;
            outline: none;
            text-align: center;
        }
        .input-field:focus { border-color: var(--ct-neon); }
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn-steam { background: #171a21; color: white; border: 1px solid #2a475e; }
        .btn-steam:hover { background: #2a475e; }
        .btn-faceit { background: #ff5500; color: white; }
        .btn-faceit:hover { background: #e04b00; }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 32px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }
        .close-modal:hover { color: white; }

        /* 4. ВНУТРЕННИЙ ЛИЧНЫЙ КАБИНЕТ (КРУЖОК ПРОФИЛЯ) */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0B0E14;
            display: none;
            z-index: 99999;
            overflow-y: auto;
            padding: 30px 20px;
            box-sizing: border-box;
        }
        .profile-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .profile-header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .user-info-box {
            display: flex;
            align-items: center;
            gap: 20px;
        }

.cabinet-box {

padding-bottom: 10px;
}
/* ИИ ЧАТ БОТ ИНТЕРФЕЙС */
.chat-area {
height: 250px;
background: var(--bg-dark);

padding: 15px;
overflow-y: auto;
margin-bottom: 15px;
border: 1px solid #222;
}
.chat-msg {
margin-bottom: 12px;
max-width: 85%;
padding: 10px 15px;
border-radius: 8px;
font-size: 14px;
line-height: 1.4;
}
.msg-bot { background: var(--bg-input); color: white; align-self: flex-start; }
.msg-user { background: var(--t-neon); color: white; margin-left: auto; text-align: right; }
/* 5. НИЖНИЕ МАРКЕТИНГОВЫЕ БЛОКИ */
.bottom-sections {
max-width: 1200px;
margin: 80px auto;

display: flex;
flex-direction: column;
gap: 35px;
}
.info-block {
background: var(--bg-card);
border: 1px solid var(--border-color);
border-radius: 10px;
padding: 30px;
box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.block-title {
font-size: 22px;
margin-top: 0;
margin-bottom: 15px;
text-transform: uppercase;
letter-spacing: 0.5px;
}

document.getElementById('steamBtnText').innerText = t.steam;

// РЕНДЕР СЕТКИ КРУЖКОВ
function renderCircles(circlesTitles) {
const grid = document.getElementById('circlesGrid');
grid.innerHTML = '';
circleData.forEach((item, index) => {
const title = circlesTitles[index] || "Feature";
const card = document.createElement('div');
card.className = 'circle-card';
card.onclick = () => toggleModal(true); // Любой кружок до входа ведет на авторизацию
card.innerHTML = <div class="circle-icon">${item.icon}</div><div class="circle-title">${title}</div>;
grid.appendChild(card);
});
}
// ОТКРЫТИЕ И ЗАКРЫТИЕ МОДАЛКИ ВХОДА
function toggleModal(show) {
document.getElementById('registerModal').style.display = show ? 'flex' : 'none';
}
// ТЕСТОВЫЙ ВХОД (ПЕРЕКЛЮЧЕНИЕ НА ЛИЧНЫЙ КАБИНЕТ)
function testLogin() {
const typedNick = document.getElementById('nickInput').value || "Hillemoongg";
document.getElementById('userNickName').innerText = typedNick;
toggleModal(false);
// Прячем приветствие, выводим личный кабинет на весь экран
document.getElementById('welcomeSlide').style.display = 'none';
document.getElementById('profileModal').style.display = 'block';
// Перестраиваем сетку кружков, чтобы первый кружок (Профиль) возвращал в кабинет
const lang = document.getElementById('langSelect').value;
const t = translations[lang] || translations["ru"];
const grid = document.getElementById('circlesGrid');
grid.innerHTML = '';
circleData.forEach((item, index) => {
const card = document.createElement('div');
card.className = 'circle-card';
if(index === 0) {
card.onclick = () => { document.getElementById('profileModal').style.display = 'block'; };
} else {
card.onclick = () => alert('Вы кликнули на фичу: ' + t.circles[index] + '. Модуль ИИ находится в стадии альфа-тестирования.');
}
card.innerHTML = <div class="circle-icon">${item.icon}</div><div class="circle-title">${t.circles[index]}</div>;
grid.appendChild(card);
});
}
// ВЫХОД ИЗ ПРОФИЛЯ
function logout() {
document.getElementById('profileModal').style.display = 'none';
document.getElementById('welcomeSlide').style.display = 'flex';
changeLanguage();
}
// ОТПРАВКА СООБЩЕНИЙ В ИИ ЧАТ-БОТ
function sendChatMessage() {
const input = document.getElementById('chatInput');
const text = input.value.trim();
if(!text) return;
const area = document.getElementById('chatArea');
// Сообщение пользователя
const uMsg = document.createElement('div');
uMsg.className = 'chat-msg msg-user';
uMsg.innerText = text;
area.appendChild(uMsg);
input.value = '';
// Эмуляция ответа ИИ
setTimeout(() => {
const bMsg = document.createElement('div');
bMsg.className = 'chat-msg msg-bot';
bMsg.innerText = 'Я проанализировал твой вопрос. Чтобы улучшить этот показатель в CS2, рекомендую зайти на карту CyberShok DM и сделать 100 киллов только в голову (One-tap).';
area.appendChild(bMsg);
area.scrollTop = area.scrollHeight;
}, 800);
}
