<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERX AI - Профессиональная Тренировочная Платформа</title>
    <style>
        /* БАЗОВАЯ МАТОВАЯ КИБЕРСПОРТИВНАЯ ТЕМА (CYBERX) */
        :root {
            --bg-dark: #05070a;
            --bg-sidebar: #090d16;
            --bg-card: rgba(19, 23, 34, 0.75);
            --bg-input: #161c28;
            --border: rgba(30, 37, 53, 0.5);
            --text-main: #ffffff;
            --text-muted: #5e6573;
            --success: #00ff66;
            --accent: #00a3ff; /* Динамический неон, меняется скриптом */
            --accent-glow: rgba(0, 163, 255, 0.4);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden;
        }

        /* ОСНОВНОЙ СЕТОЧНЫЙ ШАБЛОН САЙТА */
        .app-wrapper {
            display: grid;
            grid-template-columns: 260px 1fr 320px; /* Сайдбар | Контент | Лента TikTok */
            min-height: 100vh;
            width: 100%;
        }
        @media(max-width: 1200px) { .app-wrapper { grid-template-columns: 240px 1fr; } .tiktok-sidebar { display: none; } }
        @media(max-width: 900px) { .app-wrapper { grid-template-columns: 1fr; } .sidebar { display: none; } }

        /* ЛЕВОЕ МЕНЮ (САЙДБАР) */
        .sidebar {
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar-logo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .sidebar-logo {
            width: 40px; height: 40px; border-radius: 8px;
            background: linear-gradient(135deg, #ff5500, #00a3ff);
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 18px; box-shadow: 0 0 15px var(--accent-glow);
        }
        .sidebar-logo-text { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: white; }
        .menu-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 25px; }
        .menu-label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; margin-left: 10px; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            border-radius: 6px; color: #ced4da; text-decoration: none;
            font-weight: bold; font-size: 14px; transition: all 0.2s;
            cursor: pointer; border: none; background: none; width: 100%; text-align: left;
        }
        .menu-item:hover, .menu-item.active { background: var(--bg-card); color: white; border-left: 3px solid var(--accent); }

        /* ЦЕНТРАЛЬНАЯ ЗОНА */
        .main-content { display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; width: 100%; }

        /* НАВБАР С ВЫБОРОМ 30 ЦВЕТОВ */
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 35px; background: var(--bg-sidebar); padding: 15px 30px;
            border-radius: 8px; border: 1px solid var(--border); width: 100%; box-sizing: border-box;
        }
        .navbar-actions { display: flex; align-items: center; gap: 15px; position: relative; }
        .btn-auth {
            padding: 12px 24px; border-radius: 4px; font-weight: bold; font-size: 13px;
            text-transform: uppercase; cursor: pointer; border: none; text-decoration: none; color: white;
        }
        .btn-steam { background-color: #1a9fff; box-shadow: 0 4px 15px rgba(26,159,255,0.2); }
        .btn-faceit { background-color: #ff5500; box-shadow: 0 4px 15px rgba(255,85,0,0.2); }
        .btn-donate { background: linear-gradient(90deg, #ffaa00, #ff5500); color: white; display: none; }
        
        .user-profile-tag {
            display: none; align-items: center; gap: 12px; background: var(--bg-input);
            padding: 8px 18px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer;
        }
        .user-avatar-frame { width: 26px; height: 26px; border-radius: 50%; background: #161c28; border: 2px solid var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
        
        /* СЕЛЕКТОРЫ ЦВЕТА И ЯЗЫКА */
        .custom-select {
            background: rgba(26, 31, 41, 0.95); color: white; border: 1px solid #333;
            padding: 11px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; outline: none; font-size: 13px;
        }

        /* КВАДРАТНЫЕ АНИМИРОВАННЫЕ ПЛИТКИ РЕЖИМОВ (CYBERX STYLE) */
        .modes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; width: 100%; }
        .mode-tile {
            background-color: var(--bg-card); border: 1px solid var(--border); backdrop-filter: blur(5px);
            border-radius: 8px; height: 160px; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 20px; box-sizing: border-box;
            cursor: pointer; position: relative; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mode-tile:hover { transform: scale(1.03); border-color: var(--accent); box-shadow: 0 8px 25px var(--accent-glow); }
        .mode-name { font-size: 18px; font-weight: 900; text-transform: uppercase; z-index: 2; letter-spacing: 0.5px; }
        .mode-online { font-size: 12px; color: #8a909d; z-index: 2; margin-top: 5px; display: flex; align-items: center; gap: 6px; }
        .online-dot { width: 6px; height: 6px; background-color: var(--success); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--success); }

        /* ВЕРТИКАЛЬНАЯ ЛЕНТА TIKTOK / МИНИ-ЭДИТЫ */
        .tiktok-sidebar { background-color: var(--bg-sidebar); border-left: 1px solid var(--border); padding: 25px 15px; display: flex; flex-direction: column; gap: 20px; }
        .tiktok-title { font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tiktok-video-card { width: 100%; height: 240px; background: #000; border-radius: 8px; border: 1px solid var(--border); position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .tiktok-video-card:hover { border-color: var(--accent); }
        .tiktok-overlay-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); font-size: 12px; font-weight: bold; }

        /* РАБОЧИЕ ИИ ОКНА */
        .ai-window { display: none; background: var(--bg-card); border: 1px solid var(--border); backdrop-filter: blur(10px); border-radius: 10px; padding: 30px; margin-bottom: 35px; width: 100%; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .window-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; }
        .window-title { margin: 0; font-size: 22px; text-transform: uppercase; font-weight: 900; color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        
        /* ТЕРМИНАЛ ИИ-ЧАТА */
        .chat-container { height: 280px; background: #04060a; border-radius: 6px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border); }
        .msg-wrapper { display: flex; gap: 12px; align-items: flex-start; max-width: 85%; }
        .wrapper-user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-avatar { width: 35px; height: 35px; border-radius: 50%; background: linear-gradient(135deg, #ff5500, #00a3ff); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 12px; color: white; box-shadow: 0 0 8px var(--accent-glow); flex-shrink: 0; }
        .msg { padding: 12px 18px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
        .msg-b { background: var(--bg-input); border: 1px solid var(--border); }
        .msg-u { background: var(--accent); color: white; box-shadow: 0 4px 12px var(--accent-glow); }

        /* АРХИВ ДЕМОК */
        .demo-item-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-input); padding: 15px 20px; border-radius: 6px; margin-bottom: 12px; border: 1px solid var(--border); }
        .btn-delete-demo { background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid rgba(255,68,68,0.2); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete-demo:hover { background: #ff4444; color: white; }

        /* ШИРОКИЙ РАСШИРЕННЫЙ ПОДВАЛ (INFO) */
        .bottom-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 40px; width: 100%; box-sizing: border-box; }
        .bottom-card { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 8px; padding: 25px; }
        .bottom-card h4 { margin-top: 0; margin-bottom: 12px; text-transform: uppercase; font-size: 15px; color: var(--accent); }
        .bottom-card p { font-size: 13px; color: #8a909d; line-height: 1.5; margin: 0; }
    </style>
</head>
