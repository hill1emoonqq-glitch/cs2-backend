<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERSHOK AI - Next-Gen Esports Platform</title>
    <style>
        :root {
            --bg-dark: #07090E;
            --bg-sidebar: #0B0E14;
            --bg-card: #131722;
            --bg-input: #1C2130;
            --border: #1A1F29;
            --steam-blue: #1A9FFF;
            --faceit-orange: #FF5500;
            --text-main: #FFFFFF;
            --text-muted: #626875;
            --success: #00FF66;
            --gold: #FFD700;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Arial', '-apple-system', sans-serif; overflow-x: hidden;
        }

        /* КИБЕРШОК ИНТЕРФЕЙС ВО ВЕСЬ ЭКРАН */
        .app-wrapper {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
            width: 100%;
        }
        @media(max-width: 1000px) { .app-wrapper { grid-template-columns: 1fr; } .sidebar { display: none; } }

        /* БОКОВОЕ МЕНЮ (САЙДБАР) */
        .sidebar {
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar-top { display: flex; flex-direction: column; gap: 30px; }
        .sidebar-logo-box { display: flex; align-items: center; gap: 12px; }
        .sidebar-logo {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--steam-blue), var(--faceit-orange));
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 16px; box-shadow: 0 0 10px rgba(255, 106, 0, 0.3);
        }
        .sidebar-logo-text { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }
        .menu-group { display: flex; flex-direction: column; gap: 6px; }
        .menu-label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; margin-left: 10px; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            border-radius: 6px; color: #ced4da; text-decoration: none;
            font-weight: bold; font-size: 14px; transition: all 0.2s;
            cursor: pointer; border: none; background: none; width: 100%; text-align: left;
        }
        .menu-item:hover, .menu-item.active { background: var(--bg-card); color: white; }
        .menu-premium { color: var(--gold) !important; background: rgba(255,215,0,0.03); border: 1px solid rgba(255,215,0,0.1); }
        .menu-premium:hover { background: rgba(255,215,0,0.08); }

        /* ОСНОВНОЙ КОНТЕНТ */
        .main-content { display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; width: 100%; }

        /* ВЕРХНЯЯ НАВИГАЦИЯ */
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 35px; background: var(--bg-sidebar); padding: 15px 30px;
            border-radius: 8px; border: 1px solid var(--border); width: 100%; box-sizing: border-box;
        }
        .navbar-actions { display: flex; align-items: center; gap: 15px; }
        .btn-auth {
            padding: 12px 24px; border-radius: 4px; font-weight: bold; font-size: 13px;
            text-transform: uppercase; cursor: pointer; border: none; text-decoration: none; color: white;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-auth:hover { transform: scale(1.02); }
        .btn-steam { background-color: var(--steam-blue); box-shadow: 0 4px 15px rgba(26,159,255,0.2); }
        .btn-faceit { background-color: var(--faceit-orange); box-shadow: 0 4px 15px rgba(255,85,0,0.2); }
        
        .user-profile-tag {
            display: none; align-items: center; gap: 12px; background: var(--bg-input);
            padding: 8px 18px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer;
        }
        .lang-select {
            background: rgba(26, 31, 41, 0.95); color: white; border: 1px solid #333;
            padding: 11px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; outline: none; font-size: 13px;
        }

        /* СЕТКА ИГРОВЫХ РЕЖИМОВ КИБЕРШОКА */
        .modes-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px; margin-bottom: 40px; width: 100%;
        }
        .mode-tile {
            background-color: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; height: 150px; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 20px; box-sizing: border-box;
            cursor: pointer; position: relative; transition: all 0.2s;
            background-size: cover; background-position: center;
        }
        .mode-tile:hover { transform: translateY(-5px); border-color: var(--faceit-orange); box-shadow: 0 5px 20px rgba(255,85,0,0.15); }
        .mode-tile::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(0deg, rgba(7,9,14,0.95) 0%, rgba(7,9,14,0.1) 100%);
            border-radius: 7px; z-index: 1;
        }
        .mode-name { font-size: 18px; font-weight: 900; text-transform: uppercase; z-index: 2; letter-spacing: 0.5px; }
        .mode-online { font-size: 12px; color: #8a909d; z-index: 2; margin-top: 5px; display: flex; align-items: center; gap: 6px; }
        .online-dot { width: 6px; height: 6px; background-color: var(--success); border-radius: 50%; display: inline-block; }

        /* ИИ ОКНА И ИНТЕРФЕЙСЫ ФИШЕК */
        .ai-window {
            display: none; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 30px; margin-bottom: 35px; width: 100%; box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .window-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; }
        .window-title { margin: 0; font-size: 22px; text-transform: uppercase; font-weight: 900; color: var(--faceit-orange); }

        /* ИИ ЧАТ С НАШЕЙ АВАТАРКОЙ (CA) */
        .chat-container {
            height: 260px; background: var(--bg-dark); border-radius: 6px;
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; border: 1px solid #1A1F29;
        }
        .msg-wrapper { display: flex; gap: 12px; align-items: flex-start; max-width: 80%; }
        .wrapper-user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-avatar {
            width: 35px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, var(--ct-neon), var(--t-neon));
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 12px; color: white; box-shadow: 0 0 8px rgba(0,163,255,0.4); user-select: none; flex-shrink: 0;
        }
        .user-avatar-icon { background: var(--faceit-orange); box-shadow: 0 0 8px rgba(255,85,0,0.4); }
        .msg { padding: 12px 18px; border-radius: 8px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .msg-b { background: var(--bg-input); border: 1px solid var(--border); }
        .msg-u { background: var(--faceit-orange); color: white; }

        /* ОКНО ДЕМОК И МАРКЕТА */
        .cabinet-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .market-item { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 6px; padding: 20px; text-align: center; }
        .server-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-dark); padding: 15px 20px; border-radius: 6px; border-left: 4px solid var(--steam-blue); margin-bottom: 12px; cursor: pointer; transition: background 0.2s; }
        .server-row:hover { background: var(--bg-input); }

        /* МОДАЛКА ВХОДА */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 10, 0.95); display: none; justify-content: center; align-items: center; z-index: 99999; }
        .modal-card { background: var(--bg-card); border: 2px solid var(--border); box-shadow: 0 0 40px rgba(0, 163, 255, 0.2); border-radius: 10px; padding: 40px; width: 100%; max-width: 420px; text-align: center; position: relative; }
        .modal-card-title { font-size: 22px; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-field { width: 100%; background: var(--bg-input); border: 1px solid #333; padding: 14px; border-radius: 5px; color: white; font-size: 15px; box-sizing: border-box; margin-bottom: 25px; outline: none; text-align: center; }
        .input-field:focus { border-color: var(--faceit-orange); }

        /* ПОДВАЛ */
        .bottom-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; margin-top: 20px; width: 100%; }
        .bottom-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .bottom-card h4 { margin-top: 0; margin-bottom: 12px; text-transform: uppercase; font-size: 16px; color: var(--steam-blue); letter-spacing: 0.5px; }
    </style>
</head>
