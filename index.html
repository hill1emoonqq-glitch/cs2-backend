<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 AI Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B0E14;
            color: #FFFFFF;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }
        /* Главный экран приветствия с крутым и рабочим фоном CS2 */
        .welcome-slide {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(11, 14, 20, 0.4) 0%, rgba(11, 14, 20, 0.85) 100%), 
                        url('https://fancensus.com');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        /* Верхняя панель */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00A3FF, #FF6A00);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.4);
            user-select: none;
        }
        .lang-select {
            background: rgba(26, 31, 41, 0.85);
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            outline: none;
        }
        /* Огромный маркетинговый слоган */
        .slogan-container {
            text-align: center;
            max-width: 1000px;
            z-index: 10;
            background: rgba(11, 14, 20, 0.65);
            backdrop-filter: blur(4px);
            padding: 35px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .slogan {
            font-size: 40px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.4;
            margin-bottom: 35px;
            margin-top: 0;
        }
        .ct-text { color: #00A3FF; text-shadow: 0 0 20px rgba(0, 163, 255, 0.6); }
        .t-text { color: #FF6A00; text-shadow: 0 0 20px rgba(255, 106, 0, 0.6); }
        .server-text {
            display: block;
            font-size: 54px;
            color: #FFFFFF;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            margin-top: 15px;
        }
        /* Кнопка регистрации */
        .btn-login {
            background: linear-gradient(90deg, #FF6A00 0%, #FF8C00 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 106, 0, 0.8);
        }
        .footer-text {
            margin-bottom: 20px;
            color: #aaa;
            font-size: 14px;
            z-index: 10;
            background: rgba(11, 14, 20, 0.7);
            padding: 5px 15px;
            border-radius: 10px;
        }

        /* МОДАЛЬНОЕ ОКНО РЕГИСТРАЦИИ (Исправлено) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.9);
            display: none; /* Переключили на стандартный контролируемый тип */
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: #131722;
            border: 2px solid #1A1F29;
            box-shadow: 0 0 40px rgba(0, 163, 255, 0.2);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }
        .modal-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-field {
            width: 100%;
            background: #1C2130;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: #00A3FF; }
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-steam { background: #171a21; color: white; border: 1px solid #2a475e; }
        .btn-steam:hover { background: #2a475e; }
        .btn-faceit { background: #ff5500; color: white; }
        .btn-faceit:hover { background: #e04b00; }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .close-modal:hover { color: white; }

        /* СЕТКА ИЗ 20 КРУЖКОВ */
        .circles-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .circles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            justify-items: center;
        }
        .circle-card {
            width: 160px;
            height: 160px;
            background: #131722;
            border: 2px solid #1A1F29;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            padding: 15px;
            box-sizing: border-box;
        }
        .circle-card:hover {
            transform: translateY(-5px);
            border-color: #FF6A00;
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.3);
        }
        .circle-icon { font-size: 32px; margin-bottom: 8px; }
        .circle-title { font-size: 14px; font-weight: bold; text-transform: uppercase; }

        /* НИЖНИЕ БЛОКИ */
        .bottom-sections {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }
        .info-block {
            background: #131722;
            border: 1px solid #1A1F29;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .block-title {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .block-desc {
            color: #aaa;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="welcome-slide">
        <div class="header">
            <div class="logo">CA</div> 
            <select class="lang-select" id="langSelect" onchange="changeLanguage()">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </div>

        <div class="slogan-container">
            <h1 class="slogan" id="sloganText">
                <span class="ct-text">Твой личный ИИ-тренер</span>, 
                <span class="t-text">рынок и множество другого</span> 
                <span class="server-text">ТОЛЬКО НА НАШЕМ СЕРВЕРЕ!</span>
            </h1>
            <button class="btn-login" id="mainLoginBtn" onclick="toggleModal(true)">LOG IN / REGISTER</button>
        </div>

        <div class="footer-text" id="footerText">Пролистайте вниз, чтобы увидеть фишки проекта</div>
    </div>

    <!-- ИНТЕРАКТИВНАЯ ПАНЕЛЬ ИЗ 20 КРУЖКОВ -->
    <div class="circles-section">
        <h2 style="text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; color: #00A3FF;">Панель управления фишками</h2>
        <div class="circles-grid">
            <div class="circle-card"><div class="circle-icon">👤</div><div class="circle-title">Мой Профиль</div></div>
            <div class="circle-card"><div class="circle-icon">🛒</div><div class="circle-title">Маркет</div></div>
            <div class="circle-card"><div class="circle-icon">🤖</div><div class="circle-title">ИИ Оценка</div></div>
            <div class="circle-card"><div class="circle-icon">🎯</div><div class="circle-title">ИИ Тренер</div></div>
