<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 AI Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B0E14;
            color: #FFFFFF;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }
        /* Главный экран приветствия */
        .welcome-slide {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle, rgba(26,31,41,0.6) 0%, rgba(11,14,20,1) 100%);
            position: relative;
        }
        /* Верхняя панель */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00A3FF, #FF6A00);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.4);
        }
        .lang-select {
            background: #1A1F29;
            color: white;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Огромный маркетинговый слоган */
        .slogan-container {
            text-align: center;
            max-width: 900px;
            z-index: 10;
        }
        .slogan {
            font-size: 42px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        .ct-text { color: #00A3FF; text-shadow: 0 0 15px rgba(0, 163, 255, 0.6); }
        .t-text { color: #FF6A00; text-shadow: 0 0 15px rgba(255, 106, 0, 0.6); }
        .server-text {
            display: block;
            font-size: 52px;
            color: #FFFFFF;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
            margin-top: 10px;
        }
        /* Кнопка регистрации */
        .btn-login {
            background: linear-gradient(90deg, #FF6A00 0%, #FF8C00 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 106, 0, 0.8);
        }
        .footer-text {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="welcome-slide">
        <!-- Верхняя панель -->
        <div class="header">
            <div class="logo">CA</div> <!-- Две буквы твоего будущего названия -->
            <select class="lang-select">
                <option>Русский</option>
                <option>English</option>
                <option>Deutsch</option>
                <!-- Сюда добавим остальные из 30 языков -->
            </select>
        </div>

        <!-- Центральный сочный слоган -->
        <div class="slogan-container">
            <h1 class="slogan">
                <span class="ct-text">Твой личный ИИ-тренер</span>, 
                <span class="t-text">рынок и множество другого</span> 
                <span class="server-text">ТОЛЬКО НА НАШЕМ СЕРВЕРЕ!</span>
            </h1>
            <button class="btn-login" onclick="alert('Тут откроется окно: Вход через Steam / Faceit и создание никнейма!')">LOG IN / REGISTER</button>
        </div>

        <div class="footer-text">Пролистайте вниз, чтобы узнать больше о проекте</div>
    </div>

</body>
</html>
